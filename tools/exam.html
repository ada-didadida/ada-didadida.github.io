 "《中华人民共和国国籍法》", "C": "《中华人民共和国出境 入境管理法》", "D": "《香港特别行政区基本法》", "E": "《澳门特别行政区基本法》"}, "answer": "ABCDE"}, {"id": "c189", "number": 189, "type": "choice", "stem": "自办单位因工作需要希委托地方外办为其所属在地方的单位办理护照、签证等手续， 应怎么做：", "options": {"A": "自办单位提前一个月向外交部领事司提出书面要求，说明原因及委托内容", "B": "填写《自 办单位委托地方外办为其下属单位办理护照、签证申请表》", "C": "未经外交部通知，地方外 办可接受委托为自办单位的下属单位人员办理护照", "D": "未经外交部同意，自办单位可委托 地方外办为其下属单位办理护照"}, "answer": "AB"}, {"id": "c190", "number": 190, "type": "choice", "stem": "不采集指纹信息的情况包括：", "options": {"A": "外交护照申请人", "B": "手指伤残或缺失无法采集指纹的申请人", "C": "不满 16 周岁申请人", "D": "不愿采集指纹的申请人"}, "answer": "ABC"}, {"id": "c191", "number": 191, "type": "choice", "stem": "某央企员工在境外执行常驻任务，不慎将所持公务普通护照污损，经核实其持照情 况属实。现国内应按程序为其办理——公务普通护照手续。", "options": {"A": "换发", "B": "续发", "C": "补发", "D": "新发"}, "answer": "C"}, {"id": "c192", "number": 192, "type": "choice", "stem": "护照照片编码有——位。", "options": {"A": "10", "B": "15", "C": "20", "D": "25"}, "answer": "C"}, {"id": "c193", "number": 193, "type": "choice", "stem": "在“护照业务系统”录入单位批件号时，以“国科外确字”为例，以下格式正确的是：", "options": {"A": "国科外确字{2016}0005 号", "B": "国科外确字（2016）0005 号", "C": "国科外确字【2016】0005 号", "D": "国科外确字[2016]0005 号"}, "answer": "D"}, {"id": "c194", "number": 194, "type": "choice", "stem": "上传公网人员资料中，“绿”的拼音应该录入——", "options": {"A": "LYU", "B": "LU", "C": "LY", "D": "LUY"}, "answer": "A"}, {"id": "c195", "number": 195, "type": "choice", "stem": "上传公网人员资料中，“女”的拼音应该录入——", "options": {"A": "NYU", "B": "NU", "C": "NLU", "D": "NUY"}, "answer": "A"}, {"id": "c196", "number": 196, "type": "choice", "stem": "注销护照数量较大时，应注意——", "options": {"A": "注销函所附人员名单数量和护照实体数量一致", "B": "护照以 10 本为单位分捆并编号", "C": "整理护照顺序与人员名单顺序一一对应", "D": "无需整理，全部放到窗口即可"}, "answer": "ABC"}, {"id": "c197", "number": 197, "type": "choice", "stem": "下列关于申办以色列签证的表述中哪几项正确", "options": {"A": "以色列签证不得与黎巴嫩、阿联酋、伊拉克等国的签证同时申办", "B": "以色列签证照片应 为 50*50 白底照片", "C": "以色列签证不可以办加急申请", "D": "以色列是统办国家，且需先交费 后送件"}, "answer": "AD"}, {"id": "c198", "number": 198, "type": "choice", "stem": "德国和下列哪个国家需在公函稿纸上注明“约停留至 XX 年 XX 月 XX 日”。", "options": {"A": "俄罗斯", "B": "乌兹别克斯坦", "C": "法国", "D": "哈萨克斯坦"}, "answer": "A"}, {"id": "c199", "number": 199, "type": "choice", "stem": "可以暂不送交护照原件，只送交护照复印件先行办理签证的国家是", "options": {"A": "新西兰", "B": "南非", "C": "加拿大", "D": "阿联酋"}, "answer": "C"}, {"id": "c200", "number": 200, "type": "choice", "stem": "以下哪些人员申请申根签证时可免录指纹", "options": {"A": "12 岁以下儿童", "B": "16 岁以下儿童", "C": "身体条件不允许指纹录入的人", "D": "受申根国政府 或国际组织正式邀请的国务院各部委现任副部级以上官方代表团成员"}, "answer": "ACD"}, {"id": "c201", "number": 201, "type": "choice", "stem": "办理赴法国和德国申根签证时应按预约采集指纹的时间提前（ ）到外交部领事司 提交申请材料。", "options": {"A": "2 天", "B": "1 个工作日", "C": "2 个工作日", "D": "3 个工作日"}, "answer": "C"}, {"id": "j1", "number": 1, "type": "judge", "stem": "中方赴爱尔兰签证的团组需通过英国在华签证申请中心留取指纹。", "answer": "true"}, {"id": "j2", "number": 2, "type": "judge", "stem": "申请美国签证，除特殊情况外，一般不允许团组自送自取。", "answer": "true"}, {"id": "j3", "number": 3, "type": "judge", "stem": "持 B 类美国签证过期不超过 48 个月，且签证上无“（CLEARANCE RECEIVED）字样的， 可以续签免面谈。", "answer": "true"}, {"id": "j4", "number": 4, "type": "judge", "stem": "申请加拿大签证，需在线填写提交申请表。除纸质申请表外，还需将表格电子版拷入 U 盘一并递交。", "answer": "true"}, {"id": "j5", "number": 5, "type": "judge", "stem": "持公务普通护照的商务人员赴阿根廷，可以申请两年多次入境签证，每次不超过 90 天。", "answer": "true"}, {"id": "j6", "number": 6, "type": "judge", "stem": "申请墨西哥签证需采集食指指纹，指纹颜色必须是黑色。", "answer": "true"}, {"id": "j7", "number": 7, "type": "judge", "stem": "自 2014 年 1 月起，澳大利亚旧护照上的签证可以免费移到新护照上。", "answer": "true"}, {"id": "j8", "number": 8, "type": "judge", "stem": "新西兰团签，可以办理二次或多次过境，但若因团长本人工作原因不能前往的，则该团 签需重新办理。", "answer": "true"}, {"id": "j9", "number": 9, "type": "judge", "stem": "持“护”字证的专办员，可供其出入外交部和外国驻华使馆使用。", "answer": "false"}, {"id": "j10", "number": 10, "type": "judge", "stem": "持“签”字证的专办员，可供其出入外交部和外国驻华使馆使用。", "answer": "true"}, {"id": "j11", "number": 11, "type": "judge", "stem": "参加外交部领事司培训并考试合格的，可取得长期专办员证。", "answer": "true"}, {"id": "j12", "number": 12, "type": "judge", "stem": "持公务护照过境德国前往波兰必须办理德入境签证。", "answer": "true"}, {"id": "j13", "number": 13, "type": "judge", "stem": "持有效期 3 个月以上的美国、加拿大签证，可以免签入境哥斯达黎加。", "answer": "true"}, {"id": "j14", "number": 14, "type": "judge", "stem": "申请澳大利亚商务签证，除了填写 1415 表和 956A 表，还需填写 54 家属表。", "answer": "false"}, {"id": "j15", "number": 15, "type": "judge", "stem": "持瑞士有效签证，可免签在罗马尼亚过境停留 5 天。", "answer": "true"}, {"id": "j16", "number": 16, "type": "judge", "stem": "持公务护照前往俄罗斯、韩国 30 天内都免签。", "answer": "true"}, {"id": "j17", "number": 17, "type": "judge", "stem": "申请德国签证护照上未签字，将被使馆直接退回。", "answer": "true"}, {"id": "j18", "number": 18, "type": "judge", "stem": "申请英国签证和德国签证，都不需酒店和机票订单。", "answer": "true"}, {"id": "j19", "number": 19, "type": "judge", "stem": "哈萨克斯坦申请表必须正反面填写。", "answer": "true"}, {"id": "j20", "number": 20, "type": "judge", "stem": "申请奥地利签证的团组的所有申请材料均需每人一份。", "answer": "true"}, {"id": "j21", "number": 21, "type": "judge", "stem": "2014 年 11 月 11 日，中美商务、旅游、留学人员互发长期签证互惠安排协议生效。申 请 B1/B2 类签证有效期最长可达 10 年，F 类签证最长可达 5 年。", "answer": "true"}, {"id": "j22", "number": 22, "type": "judge", "stem": "澳大利亚在华启动颁发（无贴纸）电子签证后，我因公出国团组的出境证明统一由外 交部领事司开具。", "answer": "false"}, {"id": "j23", "number": 23, "type": "judge", "stem": "办理新西兰和加拿大签证时，可以护照复印件排队。", "answer": "false"}, {"id": "j24", "number": 24, "type": "judge", "stem": "办理申根国签证，首站去往哪国就向哪国递交申请。", "answer": "false"}, {"id": "j25", "number": 25, "type": "judge", "stem": "申请法国签证要根据申请人长期居住地来确定向相应法驻华使领馆递交申请。", "answer": "true"}, {"id": "j26", "number": 26, "type": "judge", "stem": "自 2014 年 10 月 28 日起，中国公民持有英国和爱尔兰任何一国签发的标有“BIVS”标 识的短期访问签证，可在签证有效期内免签入境另一个国家。", "answer": "true"}, {"id": "j27", "number": 27, "type": "judge", "stem": "中国籍持卡人持有效卡最多可以入境 21 个经济体。", "answer": "false"}, {"id": "j28", "number": 28, "type": "judge", "stem": "申请人更换新的护照后，旅行卡自动作废，只能申办新的 APEC 商务旅行卡。", "answer": "false"}, {"id": "j29", "number": 29, "type": "judge", "stem": "申请人若不方便在事先预约好的时间前往美国驻华使馆面谈，在面谈时间 48 小时后重 新预约，最多只能重约两次。", "answer": "true"}, {"id": "j30", "number": 30, "type": "judge", "stem": "澳大利亚的签证还在有效期内，但有任务再次前往，只需单位开具出境证明即可。", "answer": "true"}, {"id": "j31", "number": 31, "type": "judge", "stem": "由外专局出资培训的团组，必须要有外专局的批文。", "answer": "true"}, {"id": "j32", "number": 32, "type": "judge", "stem": "前往列支敦士登，签证由瑞士驻华使馆代办，手续同申请瑞士签证。", "answer": "true"}, {"id": "j33", "number": 33, "type": "judge", "stem": "出具出国（境）证明的单位须是经过外交部领事司批准的有一定外事审批权的单位。", "answer": "false"}, {"id": "j34", "number": 34, "type": "judge", "stem": "各单位的出国任务批件、任务通知书及任务确认件应使用计算机制作填写打印，不得 涂改。", "answer": "true"}, {"id": "j35", "number": 35, "type": "judge", "stem": "签证是一国政府主管机关依照法律规章为申请入、出和过境的外国人颁发的一种许可 证明。", "answer": "true"}, {"id": "j36", "number": 36, "type": "judge", "stem": "申请沙特签证，照会上需写明乘坐的航班号。", "answer": "true"}, {"id": "j37", "number": 37, "type": "judge", "stem": "入境签证是准予持证人在规定的期限内，由对外开放或指定的口岸进入该国国境的签 证。", "answer": "true"}, {"id": "j38", "number": 38, "type": "judge", "stem": "申请英国签证和加拿大签证时，申请表必须机打。", "answer": "true"}, {"id": "j39", "number": 39, "type": "judge", "stem": "申请哥斯达黎加签证，不需填写申请表。", "answer": "true"}, {"id": "j40", "number": 40, "type": "judge", "stem": "出境签证是准予持证人经过对外开放或指定的口岸离开该国国境的签证。", "answer": "true"}, {"id": "j41", "number": 41, "type": "judge", "stem": "口岸签证也称落地签证，是一国签证机关依法在本国入境口岸向已抵达的外国人颁发 的签证。", "answer": "true"}, {"id": "j42", "number": 42, "type": "judge", "stem": "外交签证是一国政府主管机关依法为进入或经过该国国境应当给予外交特权和豁免的 人员颁发的签证。", "answer": "true"}, {"id": "j43", "number": 43, "type": "judge", "stem": "公务签证可以发给持公务护照、因公普通护照人员。", "answer": "false"}, {"id": "j44", "number": 44, "type": "judge", "stem": "礼遇签证是一些国家政府主管机关依法为进入或经过该国国境应当给予相应礼遇的人 员所颁发的签证。", "answer": "true"}, {"id": "j45", "number": 45, "type": "judge", "stem": "普通签证一般颁发给持普通护照或其他有效国际旅行证件人员。", "answer": "true"}, {"id": "j46", "number": 46, "type": "judge", "stem": "贴纸式签证是将签证的内容按照固定的格式做在签证专用纸上，用不干胶贴在申请人 的护照上。", "answer": "true"}, {"id": "j47", "number": 47, "type": "judge", "stem": "另纸签证不可以单独使用，必须与申请人护照或证件同时使用。", "answer": "true"}, {"id": "j48", "number": 48, "type": "judge", "stem": "申请英国签证，因团组某成员没在约好的时间按指纹，则该团组全部退回重新预约办 理。", "answer": "false"}, {"id": "j49", "number": 49, "type": "judge", "stem": "签证申请被拒签后，在一定期限内不可以再继续申请。", "answer": "false"}, {"id": "j50", "number": 50, "type": "judge", "stem": "外国人如有需要，可以在中国申请商务旅行卡。", "answer": "false"}, {"id": "j51", "number": 51, "type": "judge", "stem": "加拿大和美国是 APEC 商务旅行卡的过渡成员国，目前不审批外方旅行卡申请。", "answer": "true"}, {"id": "j52", "number": 52, "type": "judge", "stem": "专办员应该是本单位正式职工或临时聘用人员。", "answer": "false"}, {"id": "j53", "number": 53, "type": "judge", "stem": "各单位出国（境）证明上使用的印章须向外交部办公厅备案，并由外交部办公厅通知 公安部出入境管理局。", "answer": "false"}, {"id": "j54", "number": 54, "type": "judge", "stem": "电子签证是指利用计算机网络和磁卡技术，开发并试用的签证。", "answer": "true"}, {"id": "j55", "number": 55, "type": "judge", "stem": "申根签证申请人在有效期限内可以出入申根国家。", "answer": "true"}, {"id": "j56", "number": 56, "type": "judge", "stem": "自 2013 年 3 月 16 日起，美国驻华使馆启用签证预约系统。各办证单位需通过外交部 领事司出国签证处申请因公预约帐户。该帐户也可在紧急情况时用于因私目的申请预约。", "answer": "false"}, {"id": "j57", "number": 57, "type": "judge", "stem": "美国签证申请团组必须通过外交部领事司在公开网站上申请签证预约。", "answer": "false"}, {"id": "j58", "number": 58, "type": "judge", "stem": "签证自办单位可以凭外交部领事司介绍信向统办国家使馆递交申请或领取已办妥的签 证。", "answer": "true"}, {"id": "j59", "number": 59, "type": "judge", "stem": "自送自取是指签证专办员自行前往外国驻华使馆办理送签和取签手续。", "answer": "false"}, {"id": "j60", "number": 60, "type": "judge", "stem": "外国驻华使馆可以接受因公因私护照混送的签证申请。", "answer": "false"}, {"id": "j61", "number": 61, "type": "judge", "stem": "外国驻华使馆的签证申请表均可以使用复印件。", "answer": "false"}, {"id": "j62", "number": 62, "type": "judge", "stem": "返签是指外国驻华使领馆将签证申请报其国内主管部门批准或由申请人提前向目的地 国有关部门提出申请批准后，再由驻华使领馆签发的签证。", "answer": "true"}, {"id": "j63", "number": 63, "type": "judge", "stem": "“黑名单”是指因一些原因不受他国欢迎而被限制或拒绝入境的人员名单。", "answer": "true"}, {"id": "j64", "number": 64, "type": "judge", "stem": "签证申请被某国拒签后将永远不能申请该国签证。", "answer": "false"}, {"id": "j65", "number": 65, "type": "judge", "stem": "持因公护照人员前往免签国家时，需提前由外交部领事司开具出国（境）证明。", "answer": "false"}, {"id": "j66", "number": 66, "type": "judge", "stem": "申请人持有效护照和某国有效签证一定可以入境该国。", "answer": "false"}, {"id": "j67", "number": 67, "type": "judge", "stem": "持有效证件和有效美国签证短期赴墨西哥可免办墨西哥签证。", "answer": "true"}, {"id": "j68", "number": 68, "type": "judge", "stem": "韩国签证申请表可以用英文填写。", "answer": "false"}, {"id": "j69", "number": 69, "type": "judge", "stem": "申请澳大利亚签证，名单表和护照复印件均需两份。", "answer": "false"}, {"id": "j70", "number": 70, "type": "judge", "stem": "专办员可以为本人参加的团组申办签证。", "answer": "false"}, {"id": "j71", "number": 71, "type": "judge", "stem": "按照国际惯例，我申办签证的照会、公函一般使用中文。", "answer": "true"}, {"id": "j72", "number": 72, "type": "judge", "stem": "团组申办三个以上的申根国家，申请签证时只需提供一个国家签证的邀请函。", "answer": "false"}, {"id": "j73", "number": 73, "type": "judge", "stem": "申请新西兰 3 个人以上的团组签证时，根据团组需要可申请个人签证或团签。", "answer": "true"}, {"id": "j74", "number": 74, "type": "judge", "stem": "申请新西兰签证必须有邀请信，但可以不要派遣函。", "answer": "false"}, {"id": "j75", "number": 75, "type": "judge", "stem": "双跨团组申请签证时，组团单位和被组团单位都可以为该团组办理签证。", "answer": "true"}, {"id": "j76", "number": 76, "type": "judge", "stem": "持外交护照申请美国签证时，不需交费，不需面谈。", "answer": "false"}, {"id": "j77", "number": 77, "type": "judge", "stem": "副部级以上的团组出访时，不管什么系统的单位，必须要有国务院批文。", "answer": "false"}, {"id": "j78", "number": 78, "type": "judge", "stem": "申办法国签证时，名单表需盖外交部公章。", "answer": "true"}, {"id": "j79", "number": 79, "type": "judge", "stem": "团组赴未建交国家时，需报外交部有关司会签。", "answer": "true"}, {"id": "j80", "number": 80, "type": "judge", "stem": "申请英国属地签证且不经停英国本土的，无需指纹预约。", "answer": "true"}, {"id": "j81", "number": 81, "type": "judge", "stem": "申请德国签证，三个人以上要填写名单表。", "answer": "false"}, {"id": "j82", "number": 82, "type": "judge", "stem": "去英国使馆按指纹时，需带身份证。", "answer": "true"}, {"id": "j83", "number": 83, "type": "judge", "stem": "自 2013 年 5 月 15 日起，所有申请土耳其签证中国公民均可申请一次入境电子签证。", "answer": "false"}, {"id": "j84", "number": 84, "type": "judge", "stem": "自 2014 年 11 月 14 日起，申办哈萨克斯坦签证可由外交部领事司出国签证处统一代为 收费。", "answer": "true"}, {"id": "j85", "number": 85, "type": "judge", "stem": "自 2013 年 6 月 28 日起，申请伊朗签证需等材料审核通过后，可由外交部领事司代为 交费。", "answer": "true"}, {"id": "j86", "number": 86, "type": "judge", "stem": "申请申根签证必须购买保险。", "answer": "true"}, {"id": "j87", "number": 87, "type": "judge", "stem": "申请马拉维签证时，申请人只需填写签证申请表正面信息。", "answer": "false"}, {"id": "j88", "number": 88, "type": "judge", "stem": "自 2013 年 7 月 30 日起，申请纳米比亚签证时均须使馆审核材料通过后再交费。", "answer": "true"}, {"id": "j89", "number": 89, "type": "judge", "stem": "自 2014 年 1 月 1 日起，赤道几内亚签证均加盖一枚红色的小圆章才有效。", "answer": "true"}, {"id": "j90", "number": 90, "type": "judge", "stem": "澳大利亚和新西兰要求申请人入境只能持有一个有效的入境签证，因为他们这两个国 家存在签证覆盖问题。", "answer": "true"}, {"id": "j91", "number": 91, "type": "judge", "stem": "在 21 个经济体中，中国大陆与香港、台湾互不适用 APEC 商务旅行卡。", "answer": "true"}, {"id": "j92", "number": 92, "type": "judge", "stem": "美国送办签证分为两种方式：一种是直接向使馆递送材料及护照；另一种是申请单位 自行预约面谈时间，申请材料、护照原件及面谈时间确认页由团组成员面谈时自行送往使 馆。", "answer": "true"}, {"id": "j93", "number": 93, "type": "judge", "stem": "我国持卡人旅行卡背面的经济体缩写最多有 16 个，其中 IDN 是印度的缩写。", "answer": "false"}, {"id": "j94", "number": 94, "type": "judge", "stem": "应旅行卡持卡人要求，美国驻华使领馆可为有需要的持卡人提供签证面谈预约提前的 便利。", "answer": "true"}, {"id": "j95", "number": 95, "type": "judge", "stem": "旅行卡丢失后，只能重新申请办理新的旅行卡，不可以申请补发。", "answer": "false"}, {"id": "j96", "number": 96, "type": "judge", "stem": "申情人如有需要提前制卡，可由申请人所在单位向申请材料受理单位提出申请，由受 理单位报经外交部领事审批同意出卡。", "answer": "true"}, {"id": "j97", "number": 97, "type": "judge", "stem": "APEC21 个成员中有中国香港和中国台湾等地区成员。经协商一致，APEC 成员均称为经 济体，英文为 economy。", "answer": "true"}, {"id": "j98", "number": 98, "type": "judge", "stem": "公务签证是一国政府主管机关依法为进入或经过该国国境应当给予公务人员待遇的人 士所颁发的签证。", "answer": "true"}, {"id": "j99", "number": 99, "type": "judge", "stem": "贴纸式签证是将签证的内容按照固定的格式做在签证专用纸上，将做好的签证贴在申 请人的护照上。", "answer": "true"}, {"id": "j100", "number": 100, "type": "judge", "stem": "团体签证是团组成员因相同的入境目的共同申请签证。实践中可能是多人共用一张签 证，也可能是团组各人分别持有签证。持有按团体受理并办妥的团体签证，要求团组成员 共同出入境，团组成员发生变化时，无需重新申请签证。", "answer": "false"}, {"id": "j101", "number": 101, "type": "judge", "stem": "过境签证是准予持证人在规定的期限内，由某国对外开放或指定的口岸前往第三国的 签证。要取得过境签证，须事先获取目的地国家的有效入境签证或许可证明（免签国家除 外）。", "answer": "true"}, {"id": "j102", "number": 102, "type": "judge", "stem": "护照的“持照人签名”栏一般应由本人签名，否则可能在申请外国签证时被拒签。学 龄前儿童可不签名或由监护人代签。", "answer": "true"}, {"id": "j103", "number": 103, "type": "judge", "stem": "机读签证指适用于机器阅读的签证。国际民航组织机读旅行证件咨询部在机读护照技 术要求的基础上，开发和制定用机器阅读和识别签证的技术要求，以实现用机器阅读签证 的目标，为简便国际旅行手续提供新的技术手段。", "answer": "true"}, {"id": "j104", "number": 104, "type": "judge", "stem": "中国驻外使领馆可以受理 APEC 商务旅行卡申请。", "answer": "false"}, {"id": "j105", "number": 105, "type": "judge", "stem": "APEC 商务旅行卡实质是单边签证。", "answer": "false"}, {"id": "j106", "number": 106, "type": "judge", "stem": "APEC 商务旅行卡持卡人赴美国、加拿大可以走快速通关通道。", "answer": "true"}, {"id": "j107", "number": 107, "type": "judge", "stem": ".双跨人员必须按行政隶属关系进行审批，组团单位不得为其它单位参团人员统一申 请护照。", "answer": "true"}, {"id": "j108", "number": 108, "type": "judge", "stem": "副省、部级以上领导率领出访的团组，不需要中央外事领导小组或国务院审批文件。", "answer": "false"}, {"id": "j109", "number": 109, "type": "judge", "stem": "特批护照通常仅签发 1 年，一次使用，用毕收回注销。", "answer": "true"}, {"id": "j110", "number": 110, "type": "judge", "stem": "地方外办受理的特批申请均需报领事司审批。", "answer": "true"}, {"id": "j111", "number": 111, "type": "judge", "stem": "办理准持因公护照的办证人员须先到干部值班窗口递交材料。经干部审批后，办证人 员将全部材料递交到接案受理窗口。", "answer": "true"}, {"id": "j112", "number": 112, "type": "judge", "stem": "办理加急护照的办证人员须先到干部值班窗口递交材料。经干部审核同意后，办证人 员将全部材料递交到接案受理窗口。", "answer": "true"}, {"id": "j113", "number": 113, "type": "judge", "stem": "因公出国人员必须持用因公护照。", "answer": "true"}, {"id": "j114", "number": 114, "type": "judge", "stem": "因公出国人员不得因公、因私护照混持。", "answer": "true"}, {"id": "j115", "number": 115, "type": "judge", "stem": "因公外派常驻人员的护照因有效期不足半年、签证页用完、损毁、丢失等原因需要换 /补发，应该由该驻外机构或当事人直接向派出单位提交申请，再由派出单位向护照处提交 申请。", "answer": "true"}, {"id": "j116", "number": 116, "type": "judge", "stem": "境外换发公函（“关于因公外派常驻人员护照手续的申请”）需以在领事司备案的单 位印章及签署人盖印并签署。如公函内容超过 1 页，应在所有公函纸上以备案印章骑缝章。", "answer": "true"}, {"id": "j117", "number": 117, "type": "judge", "stem": "出国执行公务人员回国后必须在 7 天内将护照交护照保管单位保管。", "answer": "true"}, {"id": "j118", "number": 118, "type": "judge", "stem": "对逾期不交或拒不上交护照者，办照单位应自逾期后 5 个工作日内向护照处书面报告。", "answer": "true"}, {"id": "j119", "number": 119, "type": "judge", "stem": "被单位定为专办员后需先在护照处备案。", "answer": "true"}, {"id": "j120", "number": 120, "type": "judge", "stem": "专办员不得为自己办理护照。", "answer": "true"}, {"id": "j121", "number": 121, "type": "judge", "stem": "专办员证除供出入外交部及外国驻华使馆办理业务使用，还可用作其余用途。", "answer": "false"}, {"id": "j122", "number": 122, "type": "judge", "stem": "专办员不履行职责或违反有关专办员证管理的，外交部领事司将予以处罚。", "answer": "true"}, {"id": "j123", "number": 123, "type": "judge", "stem": "申请人不得为自己办理护照。", "answer": "true"}, {"id": "j124", "number": 124, "type": "judge", "stem": "专办员可以凭任务批件到领事司护照处为本人申请护照。", "answer": "false"}, {"id": "j125", "number": 125, "type": "judge", "stem": "授权签署人不可以签署办理本人护照的任务批件。", "answer": "true"}, {"id": "j126", "number": 126, "type": "judge", "stem": "护照自办单位的因公护照收缴与管理工作必须实行专人负责制。", "answer": "true"}, {"id": "j127", "number": 127, "type": "judge", "stem": "护照持有人可以自行保管护照。", "answer": "false"}, {"id": "j128", "number": 128, "type": "judge", "stem": "护照自办单位可委托中介公司收缴和保管因公护照。", "answer": "false"}, {"id": "j129", "number": 129, "type": "judge", "stem": "护照自办单位不必使用计算机系统管理并监控护照催缴、收缴情况。", "answer": "false"}, {"id": "j130", "number": 130, "type": "judge", "stem": "凡公费出国（境）的团组和个人必须通过因公出国（境）渠道办理手续，严禁持普通 护照出国执行公务。", "answer": "true"}, {"id": "j131", "number": 131, "type": "judge", "stem": "根据中央有关规定，因公出国人员应在回国（境）7 天内交回所持因公出国（境）证 件。", "answer": "true"}, {"id": "j132", "number": 132, "type": "judge", "stem": "对于已剪角、打孔的注销护照，护照自办单位可交由持照人本人留存。", "answer": "true"}, {"id": "j133", "number": 133, "type": "judge", "stem": "一般情况下，如申请人原持护照仍然有效，则其新照申请将被退回。", "answer": "true"}, {"id": "j134", "number": 134, "type": "judge", "stem": "公民因前往外国定居、探亲、学习、就业、旅行、从事商业活动等非公务原因出国的， 由本人向户籍所在地的县级以上地方人民政府公安机关出入境管理机构申请普通护照。", "answer": "true"}, {"id": "j135", "number": 135, "type": "judge", "stem": "因工作调动或退休等原因离开原单位的人员，所持护照应由原单位交发照单位注销。", "answer": "true"}, {"id": "j136", "number": 136, "type": "judge", "stem": "如常驻国外的中资公司人员不慎遗失护照，应自行联系国内派出单位，根据人员隶属 关系，统一由护照自办单位向原发照机关提出补照申请。", "answer": "true"}, {"id": "j137", "number": 137, "type": "judge", "stem": "向外交部申办外交护照、公务护照的单位，由其外事部门或其他主管部门负责本单位 外交护照、公务护照的收缴和保管工作。", "answer": "true"}, {"id": "j138", "number": 138, "type": "judge", "stem": "根据有关规定，需申办超范围颁发外交或公务护照的，应提交正式函件申请。函中除 写明申办理由外，还应具备单位函号和主管领导签名。", "answer": "true"}, {"id": "j139", "number": 139, "type": "judge", "stem": "特批护照经催缴仍不交或因保管不善造成护照丢失的单位，6 个月内将不予办理特批 护照。", "answer": "true"}, {"id": "j140", "number": 140, "type": "judge", "stem": "单位如发现某职员擅自离职，且所持因公护照无法收缴，应尽快将有关情况书面报领 事司注销该职员所持因公护照。", "answer": "true"}, {"id": "j141", "number": 141, "type": "judge", "stem": "自办单位如发现从其它单位调入的职员已有有效的因公护照，应督促其将护照送回原 单位，由原单位交回领事司注销，之后方可为其申办新照。", "answer": "true"}, {"id": "j142", "number": 142, "type": "judge", "stem": "专办员只能办理本单位因公出国人员护照相关事宜，不得为其他单位人员办理因公出 国手续。", "answer": "true"}, {"id": "j143", "number": 143, "type": "judge", "stem": "专办员证件改版后，外交部领事司为初次从事专办员工作的专办员或未参加业务培训 的专办员颁发 6 个月内有效证件。", "answer": "true"}, {"id": "j144", "number": 144, "type": "judge", "stem": "原则上，每个自办单位专办员数量不能超过 3 人，如因工作量大或其他特殊原因确需 增加，由办证单位向外交部领事司提出书面申请。", "answer": "true"}, {"id": "j145", "number": 145, "type": "judge", "stem": "自办单位名称、地址、电话、签署人等任何一项发生变动时，应及时向外交部领事司 报备新的《因公护照签证备案表》。", "answer": "true"}, {"id": "j146", "number": 146, "type": "judge", "stem": "专办员因离职、调岗等原因不再从事专办员工作时，办证单位应及时以书面形式通知 外交部领事司，并将其专办员证件退回。", "answer": "true"}, {"id": "j147", "number": 147, "type": "judge", "stem": "出国人员持用护照的种类由其身份和出国性质决定。", "answer": "true"}, {"id": "j148", "number": 148, "type": "judge", "stem": "中华人民共和国护照是中华人民共和国公民出入国境和在国外证明国籍和身份的证 件。任何组织或者个人不得伪造、变造、转让、故意损毁或者非法扣押护照。", "answer": "true"}, {"id": "j149", "number": 149, "type": "judge", "stem": "专办员证过期可以直接去窗口办理护照事宜。", "answer": "false"}, {"id": "j150", "number": 150, "type": "judge", "stem": "APEC 商务旅行卡原则上只适用于以商务为目的的国际旅行而不能用于旅游、探亲、 访友、看病等非商务目的的活动，目前仅澳大利亚和泰国允许非商务目的旅行。", "answer": "true"}, {"id": "j151", "number": 151, "type": "judge", "stem": "自办单位未经外交部领事司授权不可擅自委托地方外办为其在当地的所属单位人员办 理护照。", "answer": "true"}, {"id": "j152", "number": 152, "type": "judge", "stem": "各地方外办未经外交部通知，不应擅自为护照自办单位的下属单位人员颁发护照。", "answer": "true"}, {"id": "j153", "number": 153, "type": "judge", "stem": "取得护照自办权的单位，若改由地方外办发照，今后不再向外交部申办护照。", "answer": "true"}, {"id": "j154", "number": 154, "type": "judge", "stem": "原则上各地方外办不得擅自相互委托办照。", "answer": "true"}, {"id": "j155", "number": 155, "type": "judge", "stem": "各地方外办或地方外办授权的采集单位采集电子护照申请人的指纹信息，应通过捺印 指纹方式采集。每位申请人采集 2 枚指纹信息，采集过程原则上不超过 2 分钟。", "answer": "true"}, {"id": "j156", "number": 156, "type": "judge", "stem": "年满 16 周岁以上的申请人原则上需采集本人的指纹信息。", "answer": "true"}, {"id": "j157", "number": 157, "type": "judge", "stem": "采集具备签名能力的申请人本人真实姓名的手写签名信息，可以代签。", "answer": "false"}, {"id": "j158", "number": 158, "type": "judge", "stem": "若任务批件号不变但人员名单有变化，可以二次使用该批件。", "answer": "false"}, {"id": "j159", "number": 159, "type": "judge", "stem": "申请护照本人可以拿着专办员证到窗口送件。", "answer": "false"}, {"id": "j160", "number": 160, "type": "judge", "stem": "任务批件和出国人员名单须由有出国任务审批权的备案单位盖章，不需要备案领导签 字。", "answer": "false"}, {"id": "j161", "number": 161, "type": "judge", "stem": "出国人员名单各页及落款处须盖公章。", "answer": "true"}, {"id": "j162", "number": 162, "type": "judge", "stem": "前来护照处窗口申办护照人员，应首先主动向工作人员出示专办员证件，非专办员应 主动出示本人介绍信和身份证。", "answer": "true"}, {"id": "j163", "number": 163, "type": "judge", "stem": "上传公网人员资料中，“吕”的拼音应该录入“LYU”。", "answer": "true"}, {"id": "j164", "number": 164, "type": "judge", "stem": "办理护照注销时，一定要拿着注销函和护照实体到窗口办理。", "answer": "true"}, {"id": "j165", "number": 165, "type": "judge", "stem": "由银监会、证监会、保监会党委管理的企业领导班子成员出国，报业务监管部门审批。", "answer": "true"}, {"id": "j166", "number": 166, "type": "judge", "stem": "国资委党委管理的企业党政一把手办理护照需要国资委的批文。", "answer": "true"}, {"id": "j167", "number": 167, "type": "judge", "stem": "中央管理的企业党政一把手办理护照需要国务院的批文。", "answer": "true"}, {"id": "j168", "number": 168, "type": "judge", "stem": "市级护照签发机关可以负责本地区外交护照的申请、收缴和保管工作。", "answer": "false"}, {"id": "j169", "number": 169, "type": "judge", "stem": "市级护照签发机关可以负责本地区公务护照的印制工作。", "answer": "false"}, {"id": "j170", "number": 170, "type": "judge", "stem": "申办俄罗斯签证时，涉及政府间协议任务，问清专办员是否要注明“该团组申请免签 证费”。", "answer": "true"}, {"id": "j171", "number": 171, "type": "judge", "stem": "出国审批的原则：“分级审批、归口管理”。", "answer": "true"}, {"id": "j172", "number": 172, "type": "judge", "stem": "参加培训的团组，有两种情况不要培训件：双方协议、购买外方设备。", "answer": "true"}, {"id": "j173", "number": 173, "type": "judge", "stem": "如果签证种类相同，旧因公护照上的美国签证可与新因公护照同时使用。", "answer": "true"}, {"id": "j174", "number": 174, "type": "judge", "stem": "因私护照上有有效的美国签证，如因公出访，可不必重新申请美国签证。", "answer": "false"}, {"id": "j175", "number": 175, "type": "judge", "stem": "外交护照持有人申请美国签证均可免面谈、免留指纹。", "answer": "false"}, {"id": "j176", "number": 176, "type": "judge", "stem": "根据美国签证规定，代表中国中央政府，受美联邦政府、国会、国际组织或中国驻美 使领馆邀请，赴美执行公务或代表中央政府受第三国政府或我驻第三国使领馆邀请，赴第 三国执行公务时过境美国的因公团组方可申请外交签证，并可据此免面谈、免留指纹。", "answer": "true"}, {"id": "j177", "number": 177, "type": "judge", "stem": "省部级领导应美国州政府邀请赴美访问，可申请美国外交签证，从而可免面谈、免留 指纹。", "answer": "false"}, {"id": "j178", "number": 178, "type": "judge", "stem": "外交护照持有人申请美国 B 类签证，可免交费免预约，每周一至周五上午 9：00 至 11：00 直接赴美驻华使馆面谈。", "answer": "true"}, {"id": "j179", "number": 179, "type": "judge", "stem": "直接过境美国，不出机场，可免办美国签证。", "answer": "false"}, {"id": "j180", "number": 180, "type": "judge", "stem": "申请美国签证，预约面谈地不是北京，须由相应地方外办出具照会，外交部领事司不 负责办理。", "answer": "true"}, {"id": "j181", "number": 181, "type": "judge", "stem": "申请美国 A、G、C3 类外交签证，一般情况下最多只能申请两次入境或过境。", "answer": "true"}, {"id": "j182", "number": 182, "type": "judge", "stem": "因公申请美国 10 年多次签证，因私护照上已有的 10 多次签证会被注销。", "answer": "false"}, {"id": "j183", "number": 183, "type": "judge", "stem": "美国签证仅表明允许签证持有人进入美国口岸并提出入境申请，不能保证其能进入美 国。只有美国国土安全部和美国海关和边境保护局官员可以决定签证持有人能否入境和停 留期。", "answer": "true"}, {"id": "j184", "number": 184, "type": "judge", "stem": "因公团组同时申请加拿大和第三国签证，可先送护照复印件等签证申请材料到加驻华 使馆排队，办完第三国签证后再递交护照原件到加驻华使馆印签证。", "answer": "true"}, {"id": "j185", "number": 185, "type": "judge", "stem": "外交护照持有人申请加拿大签证可免交费，但一般只发一次有效签证。", "answer": "true"}, {"id": "j186", "number": 186, "type": "judge", "stem": "因公团组申请加拿大签证，除公司派遣函外，其他邀请函、学历证明等签证申请材料 可提供复印件。", "answer": "true"}, {"id": "j187", "number": 187, "type": "judge", "stem": "旧因公护照上如有有效的加拿大签证，需申请挪签。", "answer": "true"}, {"id": "j188", "number": 188, "type": "judge", "stem": "申请加拿大签证，所有免劳动力市场影响评估(LMIA)的工作许可签证申请都需事先支 付雇主合规费。", "answer": "true"}, {"id": "j189", "number": 189, "type": "judge", "stem": "申请加拿大签证，如需体检，须到加驻华使领馆指定的医院进行体检。", "answer": "true"}, {"id": "j190", "number": 190, "type": "judge", "stem": "持带有 BIVS 标识的英国签证可入境爱尔兰。", "answer": "true"}, {"id": "j191", "number": 191, "type": "judge", "stem": "申根签证停留期最多不超过 90 天。", "answer": "true"}];
const $ = (id) => document.getElementById(id);
const titles = {practice:'顺序练习',exam:'模拟考试',wrong:'错题复习',saved:'我的收藏'};
const copies = {practice:'按题号循序练习，答题后即时查看结果。',exam:'随机抽题，限时作答，交卷后查看成绩。',wrong:'集中复习答错的题目，逐一巩固。',saved:'把重要题目收藏起来，随时重温。'};
let savedData = {};
try { savedData = JSON.parse(localStorage.getItem('zby-progress-v1') || '{}'); } catch (_) {}
const state = {questions:[],view:'practice',type:'all',query:'',index:0,selected:[],revealed:false,progress:savedData.progress || {},saved:savedData.saved || [],exam:null,examResult:null};
const persist = () => { try { localStorage.setItem('zby-progress-v1',JSON.stringify({progress:state.progress,saved:state.saved})); } catch (_) {} };
const shuffle = (array) => [...array].sort(() => Math.random() - .5);
const isSaved = (id) => state.saved.includes(id);
const records = () => Object.values(state.progress);

function list() {
  let result = state.view === 'exam' && state.exam ? state.exam.questions : state.questions;
  if (state.view === 'wrong') result = result.filter(q => state.progress[q.id]?.wrong);
  if (state.view === 'saved') result = result.filter(q => isSaved(q.id));
  if (state.type !== 'all') result = result.filter(q => q.type === state.type);
  if (state.query) result = result.filter(q => q.stem.includes(state.query) || String(q.number) === state.query);
  return result;
}
function updateMetrics() {
  const r = records(), attempts = r.reduce((sum,x) => sum+x.attempts,0), correct = r.reduce((sum,x) => sum+x.correct,0);
  $('done-count').textContent = r.length;
  $('accuracy').textContent = attempts ? Math.round(correct/attempts*100)+'%' : '--';
  $('wrong-count').textContent = r.filter(x=>x.wrong).length;
  $('saved-count').textContent = state.saved.length;
}
function render() {
  updateMetrics();
  document.querySelectorAll('.nav').forEach(button => button.classList.toggle('active',button.dataset.view===state.view));
  document.querySelectorAll('#type-filter button').forEach(button => button.classList.toggle('selected',button.dataset.type===state.type));
  $('section-title').textContent = $('hero-title').textContent = titles[state.view];
  $('hero-copy').textContent = copies[state.view];
  $('hero-number').textContent = state.view === 'exam' && state.exam ? state.exam.questions.length : list().length;
  $('reset-search').hidden = !state.query;
  const questions = list();
  state.index = Math.min(state.index,Math.max(0,questions.length-1));
  $('position').textContent = questions.length ? `${state.index+1} / ${questions.length}` : '0 / 0';
  $('prev').disabled = state.index===0;
  $('next').disabled = state.index>=questions.length-1;
  $('finish-exam').hidden = !(state.view==='exam' && state.exam);
  if(state.view==='exam' && !state.exam && !state.examResult) return renderExamStart();
  if(state.view==='exam' && state.examResult) return renderExamResult();
  const q = questions[state.index];
  if (!q) {
    $('question-card').innerHTML = `<div class="empty"><strong>${state.view==='wrong'?'暂无错题':state.view==='saved'?'暂无收藏':'没有匹配题目'}</strong><span>${state.query?'试试其他关键词':'继续练习后，这里会出现对应题目。'}</span></div>`;
  } else renderQuestion(q);
  renderGrid(questions);
}
function renderQuestion(q) {
  const exam = state.view==='exam';
  const answer = exam ? state.exam.answers[q.id] : null;
  const selected = exam ? (answer || []) : state.selected;
  const revealed = !exam && state.revealed;
  const opts = q.type==='judge' ? {true:'正确',false:'错误'} : q.options;
  const multi = q.type==='choice' && q.answer.length>1;
  const keys = Object.keys(opts);
  const correct = q.type==='judge'?[q.answer]:q.answer.split('');
  const options = keys.map(key => {
    const picked = selected.includes(key);
    const cls = revealed ? (correct.includes(key)?'correct':picked?'incorrect':'') : picked?'picked':'';
    return `<button class="option ${cls}" data-key="${key}" ${revealed?'disabled':''}><span class="letter">${q.type==='judge'?(key==='true'?'✓':'✕'):key}</span><span>${escapeHtml(opts[key])}</span></button>`;
  }).join('');
  const result = revealed ? `<div class="result ${selected.slice().sort().join('')===correct.slice().sort().join('')?'':'bad'}"><strong>${selected.slice().sort().join('')===correct.slice().sort().join('')?'回答正确':'回答错误'}</strong>正确答案：${q.type==='judge'?(q.answer==='true'?'正确':'错误'):correct.join('、')}</div>` : '';
  $('question-card').innerHTML = `<div class="q-top"><div class="q-meta"><span class="q-badge">${q.type==='judge'?'判断题':multi?'多选题':'单选题'}</span><span class="q-num">原卷第 ${q.number} 题</span>${exam?`<span class="exam-time" id="timer"></span>`:''}</div><button class="icon-button ${isSaved(q.id)?'saved':''}" id="bookmark" title="${isSaved(q.id)?'取消收藏':'收藏题目'}" aria-label="收藏题目">${isSaved(q.id)?'★':'☆'}</button></div><h2>${escapeHtml(q.stem)}</h2><div class="options">${options}</div><div class="submit-row"><span class="hint">${exam?'模拟考试中，答案将在交卷后显示':multi?'多选题，请选择所有正确选项':'选择答案后提交查看结果'}</span>${exam?'':`<button class="primary" id="submit" ${!selected.length||revealed?'disabled':''}>提交答案</button>`}</div>${result}`;
  document.querySelectorAll('.option').forEach(button=>button.onclick=()=>{
    if(exam){
      const existing = state.exam.answers[q.id] || [];
      state.exam.answers[q.id] = multi ? (existing.includes(button.dataset.key)?existing.filter(x=>x!==button.dataset.key):[...existing,button.dataset.key]) : [button.dataset.key];
    }else state.selected = multi ? (state.selected.includes(button.dataset.key)?state.selected.filter(x=>x!==button.dataset.key):[...state.selected,button.dataset.key]) : [button.dataset.key];
    render();
  });
  $('bookmark').onclick=()=>{state.saved=isSaved(q.id)?state.saved.filter(x=>x!==q.id):[...state.saved,q.id];persist();render()};
  if(!exam) $('submit').onclick=()=>submit(q);
  if(exam) updateTimer();
}
function submit(q) {
  if(!state.selected.length || state.revealed) return;
  const expected = q.type==='judge'?[q.answer]:q.answer.split('');
  const right = state.selected.slice().sort().join('')===expected.sort().join('');
  const entry=state.progress[q.id] || {attempts:0,correct:0,wrong:false};
  entry.attempts++; if(right)entry.correct++; entry.wrong=!right;
  state.progress[q.id]=entry; state.revealed=true;persist();render();
}
function renderGrid(questions) {
  $('panel-title').textContent = state.view==='exam'&&state.exam?`答题卡 · ${Object.keys(state.exam.answers).length}/${state.exam.questions.length}`:'答题卡';
  $('question-grid').innerHTML = questions.map((q,i)=>`<button data-index="${i}" class="${i===state.index?'current':state.view==='exam'?(state.exam?.answers[q.id]?.length?'correct':''):state.progress[q.id]?.wrong?'incorrect':state.progress[q.id]?.attempts?'correct':''}" title="第 ${q.number} 题">${q.number}</button>`).join('');
  document.querySelectorAll('#question-grid button').forEach(button=>button.onclick=()=>{state.index=Number(button.dataset.index);state.selected=[];state.revealed=false;render()});
}
function renderExamStart(){
  $('finish-exam').hidden=true;
  $('question-card').innerHTML='<div class="exam-start"><span class="q-badge">模拟考试</span><h2>开始一场模拟测试</h2><p>从题库中随机抽取 50 道题，限时 60 分钟。单选、多选和判断题均须作答，交卷后显示分数与错题。此次考试进度仅在当前页面保留。</p><button class="primary" id="start-exam">开始考试</button></div>';
  $('question-grid').innerHTML='';$('position').textContent='-- / --';$('prev').disabled=$('next').disabled=true;
  $('start-exam').onclick=()=>{state.exam={questions:shuffle(state.questions).slice(0,50),answers:{},end:Date.now()+60*60*1000};state.index=0;state.examResult=null;render()};
}
function updateTimer(){if(!state.exam)return;const left=Math.max(0,Math.ceil((state.exam.end-Date.now())/1000));const timer=$('timer');if(timer)timer.textContent=`剩余 ${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(left===0)finishExam()}
function finishExam(){if(!state.exam)return;let score=0;for(const q of state.exam.questions){const selected=state.exam.answers[q.id]||[];const expected=q.type==='judge'?[q.answer]:q.answer.split('');const right=selected.slice().sort().join('')===expected.sort().join('');if(right)score++;if(selected.length){const entry=state.progress[q.id]||{attempts:0,correct:0,wrong:false};entry.attempts++;if(right)entry.correct++;entry.wrong=!right;state.progress[q.id]=entry}}state.examResult={score,total:state.exam.questions.length};state.exam=null;persist();render()}
function renderExamResult(){const {score,total}=state.examResult;$('finish-exam').hidden=true;$('question-card').innerHTML=`<div class="exam-finish"><span class="q-badge">考试完成</span><strong>${score*2} 分</strong><p>答对 ${score} / ${total} 题。答错的题目已加入错题复习。</p><button class="primary" id="review-wrong">复习错题</button> <button class="outline" id="again">再考一次</button></div>`;$('question-grid').innerHTML='';$('position').textContent='-- / --';$('prev').disabled=$('next').disabled=true;$('review-wrong').onclick=()=>switchView('wrong');$('again').onclick=()=>{state.examResult=null;render()}}
function switchView(view){state.view=view;state.index=0;state.selected=[];state.revealed=false;state.query='';$('search').value='';document.querySelector('.sidebar').classList.remove('open');render()}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('.nav').forEach(button=>button.onclick=()=>switchView(button.dataset.view));
document.querySelectorAll('#type-filter button').forEach(button=>button.onclick=()=>{state.type=button.dataset.type;state.index=0;state.selected=[];state.revealed=false;render()});
$('search').oninput=(event)=>{state.query=event.target.value.trim();state.index=0;state.selected=[];state.revealed=false;render()};
$('reset-search').onclick=()=>{$('search').value='';state.query='';render()};
$('prev').onclick=()=>{state.index--;state.selected=[];state.revealed=false;render()};
$('next').onclick=()=>{state.index++;state.selected=[];state.revealed=false;render()};
$('finish-exam').onclick=()=>{const remaining=state.exam.questions.length-Object.keys(state.exam.answers).filter(id=>state.exam.answers[id].length).length;if(remaining && !confirm(`还有 ${remaining} 道题未作答，确定交卷吗？`))return;finishExam()};
$('menu').onclick=()=>document.querySelector('.sidebar').classList.toggle('open');
$('toggle-grid').onclick=()=>document.querySelector('.panel').classList.toggle('collapsed');
$('today').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric'}).format(new Date());
setInterval(updateTimer,1000);
state.questions=EMBEDDED_QUESTIONS; render();

</script>
</body>
</html>
